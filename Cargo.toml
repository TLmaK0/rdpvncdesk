[package]
name = "rdpvncdesk"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
description = "Cross-platform RDP client (Windows, Linux, macOS) from a single Rust codebase"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TLmaK0/rdpvncdesk"
readme = "README.md"
keywords = ["rdp", "remote-desktop", "client"]
categories = ["network-programming", "gui"]

[dependencies]
# RDP protocol stack (pure Rust, same code on every OS)
ironrdp = { version = "0.17", features = ["client", "native-tls", "input", "connector", "pdu", "session"] }

# Window and software rendering
winit = { version = "0.30", features = ["rwh_06"] }
softbuffer = "0.4"

# Runtime, CLI, logging
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
anyhow = "1"
smallvec = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "wayland", "x11"] }
keyring = "4"
directories = "6"
toml = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Receive rdp:// URLs, which macOS delivers as Apple Events rather than argv.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventManager", "NSAppleEventDescriptor", "NSString"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Patched copy, see the "rdpvncdesk patch" comments in vendor/ironrdp-connector (issue #1).
[patch.crates-io]
ironrdp-connector = { path = "vendor/ironrdp-connector" }
